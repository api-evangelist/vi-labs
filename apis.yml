aid: vi-labs
name: Vi Labs
description: 'Vi Labs (vi.co) is a New York-headquartered enterprise AI company for health, founded in
  2011 and led by co-founder and CEO Omri Yoffe, with offices in Brooklyn, Los Angeles, Boston and Tel
  Aviv. Its platform is an AI orchestration layer for healthcare systems, payers, biopharma and wellness
  enterprises, built on the Vi Data Web — a privacy-safe network of de-identified patient and member profiles
  enriched with behavioral and consumer signals — and delivered through four applications: Vi Activate
  (patient acquisition and targeting), Vi Engage (predictive patient and provider engagement), Vi Operate
  (an agentic suite for operational workflows) and Vi Pulse (analytics and ROI reporting). The company
  says it serves more than 100 enterprise customers and supports over 190 million lives, and in May 2026
  it completed a $145M transaction at a $1.64B valuation. Vi Labs publishes no developer program, documentation
  or machine-readable API contract; its only anonymously reachable machine surface is an OAuth-protected
  Model Context Protocol endpoint served from vi.co and advertised through RFC 8414 and RFC 9728 metadata.'

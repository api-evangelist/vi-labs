apis:
- aid: vi-labs:vi-labs-mcp
  name: Vi Labs MCP Server
  description: An OAuth-protected Model Context Protocol endpoint served from the vi.co host and advertised
    through RFC 9728 protected resource metadata. It is the WordPress MCP adapter running on the Vi Labs
    corporate site — not the gated enterprise health platform behind api.vi.co — and it is the only Vi
    Labs surface an agent can address anonymously enough to discover. A JSON-RPC tools/list POST returns
    HTTP 401 with a compliant WWW-Authenticate bearer challenge, so the tool inventory and its input schemas
    require authenticated introspection.
  humanURL: https://vi.co/
  baseURL: https://vi.co/wp-json/mcp/mcp-oauth-server
